name: Monitoring checks

on:
  push:
  pull_request:

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Monitoring regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Prometheus configuration
        run: >-
          docker run --rm --entrypoint /bin/promtool
          --mount type=bind,src=${{ github.workspace }}/templates/monitoring/prometheus,dst=/etc/prometheus,readonly
          prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
      - name: HTTPS mTLS with real exporter and Prometheus
        run: python3 tests/monitoring_https_integration.py
      - name: One-off SSH provisioning with real sshd
        run: python3 tests/monitoring_ssh_integration.py
      - name: Grafana Tunnel configuration and SSH fallback
        run: python3 tests/monitoring_tunnel_integration.py
      - name: Source IP restriction in isolated network namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          sudo bash tests/monitoring_firewall_integration.sh
